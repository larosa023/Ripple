[package]
name = "ripple"
version = "1.3.0"
description = "A lightweight, fast, customizable Stremio-compatible desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ripple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
raw-window-handle = "0.6"
tauri-plugin-window-state = "2"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
