[package]
name = "ripple"
version = "0.6.0"
description = "A lightweight, fast, customizable Stremio-compatible desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ripple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
raw-window-handle = "0.6"

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
