name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to main replaces an in-progress build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      # Pushes to main publish a GitHub Release named after the app version
      # (version in src-tauri/tauri.conf.json). Bump the version to cut a new
      # release; pushes without a bump refresh the current release's installers.
      - name: Build and release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Ripple v__VERSION__
          releaseBody: Download the `.exe` (recommended) or `.msi` installer below.
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}

      # Pull requests only build, to check nothing is broken.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npx tauri build
